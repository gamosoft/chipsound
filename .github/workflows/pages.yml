name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Opt every JS action into the Node 24 runtime so the Pages-specific actions
# (upload-pages-artifact, deploy-pages) don't trip the Node 20 deprecation warning
# while their own majors catch up.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6

      - name: Assemble artifact (merge docs/ landing + src/ player)
        run: |
          set -e
          mkdir -p _site

          # Landing at root: docs/index.html, CNAME, robots.txt, sitemap.xml, third-party/, etc.
          cp -a docs/. _site/

          # Player at /player.html plus its asset tree.
          cp src/index.html _site/player.html
          cp src/favicon.ico _site/favicon.ico
          cp -a src/css _site/
          cp -a src/js  _site/

          # Inject GA4 into the public landing + player pages at deploy time.
          # Both repo sources stay GA-free so self-hosted (Docker / clone)
          # deployments remain analytics-free, and the injected snippet itself
          # is hostname-gated to chipsound.com (+ subdomains) so forks that
          # enable Pages with this workflow don't ping our property either.
          # The same block also installs a single delegated click listener for
          # data-track / data-track-* attributes — it's only registered when
          # the hostname check passes, so off-prod incurs zero per-click cost.
          for page in _site/index.html _site/player.html; do
            awk '
                /<\/head>/ {
                    print "    <!-- Google Analytics 4 (chipsound.com only; injected at deploy, source untracked) -->"
                    print "    <script>"
                    print "        (function () {"
                    print "            var h = location.hostname;"
                    print "            window.__analyticsEnabled = (h === \"chipsound.com\" || h.endsWith(\".chipsound.com\"));"
                    print "            if (!window.__analyticsEnabled) return;"
                    print ""
                    print "            var s = document.createElement(\"script\");"
                    print "            s.async = true;"
                    print "            s.src = \"https://www.googletagmanager.com/gtag/js?id=G-MQKBFSDZ5Q\";"
                    print "            document.head.appendChild(s);"
                    print ""
                    print "            window.dataLayer = window.dataLayer || [];"
                    print "            window.gtag = function gtag(){ dataLayer.push(arguments); };"
                    print "            gtag(\"js\", new Date());"
                    print "            gtag(\"config\", \"G-MQKBFSDZ5Q\");"
                    print ""
                    print "            // Declarative click tracking: data-track=\"<event>\" + any data-track-<key>=\"<val>\"."
                    print "            document.addEventListener(\"click\", function (e) {"
                    print "                var el = e.target.closest(\"[data-track]\");"
                    print "                if (!el) return;"
                    print "                var params = { transport_type: \"beacon\" };"
                    print "                for (var i = 0; i < el.attributes.length; i++) {"
                    print "                    var a = el.attributes[i];"
                    print "                    if (a.name.indexOf(\"data-track-\") === 0) {"
                    print "                        params[a.name.slice(\"data-track-\".length)] = a.value;"
                    print "                    }"
                    print "                }"
                    print "                gtag(\"event\", el.dataset.track, params);"
                    print "            });"
                    print "        })();"
                    print "    </script>"
                }
                { print }
            ' "$page" > "$page.new"
            mv "$page.new" "$page"
          done
          # Merge images (docs/images/favicon.svg + src/images/* — duplicate favicon resolves to same bytes).
          mkdir -p _site/images
          cp -a src/images/. _site/images/

          # Synthesize Caddy-shape autoindex listings so the runtime discovery in
          # js/themes.js and js/viz-engine.js sees every drop-in file. GitHub Pages
          # does not emit directory indexes; this is the bridge.
          for dir in _site/css/themes _site/js/visualizations; do
            {
              echo '<!doctype html><html><body><ul>'
              for f in "$dir"/*; do
                name=$(basename "$f")
                case "$name" in
                  _*|index.html) continue ;;
                esac
                echo "<li><a href=\"$name\">$name</a></li>"
              done
              echo '</ul></body></html>'
            } > "$dir/index.html"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
